[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsrec"
version = "0.1.0"
description = "CS4.406 Assignment 1 — lexical and semantic news recommendation on MIND-small and EB-NeRD"
requires-python = ">=3.12"
# Runtime dependencies are declared in requirements.in (loose, documents intent)
# and pinned in requirements.txt (== everywhere, regenerated by `make lock`).
# They are deliberately NOT duplicated here: one source of truth, and `make lock`
# is what produces the reproducible install a grader gets.
dependencies = []

[project.scripts]
newsrec = "newsrec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# -----------------------------------------------------------------------------
# ruff — lint and format, one tool, one config (Deliverable 5)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting (replaces isort)
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B905",  # zip() strict= — noisy on numpy/polars idioms
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of a test
    "PLR2004", # magic values in assertions are the expected value
    "SIM300",  # `config.X == {literal}` reads correctly; ruff's Yoda rule inverts it
    "B017",    # stub canary tests assert a broad raise until the checker exists
    "E402",    # sys.path bootstrap must precede importing scripts/ modules
]
# Same bootstrap: these import from src/ or scripts/ after adjusting sys.path,
# so that they run under a bare python3 in a hook or a fresh CI checkout.
"scripts/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"

# -----------------------------------------------------------------------------
# pytest — tests/ mirrors src/newsrec/ (Deliverable 5)
#
# `make test` runs ONLY fast fixture-based tests: no dataset, no GPU, target
# under 30 s. This matters because a grader clones with no data/ and no Data/.
# `make test-full` adds the realdata marker.
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra -q -m 'not realdata and not slow and not gpu'"
markers = [
    "slow: takes more than ~30 s; excluded from the default run",
    "realdata: needs the real downloaded datasets under Data/ or a built data/ store",
    "gpu: needs a CUDA device; must be skipped, never failed, on CPU-only machines",
]
filterwarnings = ["error::DeprecationWarning:newsrec.*"]
